version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recsys-backend
    ports:
      - "8001:8001"
    volumes:
      - ../../../airflow/data/raw:/app/data
    restart: unless-stopped
    networks:
      - recsys-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recsys-frontend
    ports:
      - "7861:7861"
    environment:
      - BACKEND_URL=http://backend:8001
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - recsys-network

networks:
  recsys-network:
    driver: bridge
