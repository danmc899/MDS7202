# Airflow Configuration - Cross-platform compatible
# This configuration ensures logs work on Windows, Mac, and Linux

[logging]
# Template de nombres de archivos de log compatibles con todos los OS
# Reemplaza los caracteres ':' por '_' para compatibilidad con Windows
log_filename_template = dag_id={{ ti.dag_id }}/run_id={{ ti.run_id | replace(":", "_") | replace("+", "_") }}/task_id={{ ti.task_id }}/attempt={{ try_number }}.log

# Template para logs del procesador de DAGs
dag_processor_manager_log_filename = dag_processor_manager/dag_processor_manager.log

# Template para logs del scheduler
log_processor_filename_template = {{ filename }}.log

[core]
# Usar el formato de log cross-platform
dags_folder = /opt/airflow/dags
plugins_folder = /opt/airflow/plugins
base_log_folder = /opt/airflow/logs
